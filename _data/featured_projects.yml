- name: iPatent
  repo: TIBHannover/iPatent
  description: Interactive search system for multimodal patent image search and interpretation, with clustering for exploring results. Live demo hosted by TIB.
  tags: [multimodal retrieval, patent search, vision-language models]
  code: https://github.com/TIBHannover/iPatent
  demo: https://service.tib.eu/ipatent/
  paper: /publications/awale2025ipatent/
  venue: PatentSemTech @ SIGIR 2025
  home: true

- name: Patent Figure Classification
  repo: TIBHannover/patent-figure-classification
  description: Code and the PatFigCLS / PatFigVQA datasets for classifying patent figures by type, projection, patent class and object with large vision-language models, including a tournament-style multiple-choice strategy for large label sets.
  tags: [vision-language models, classification, patents]
  code: https://github.com/TIBHannover/patent-figure-classification
  paper: /publications/awale2025patfig/
  dataset: https://github.com/TIBHannover/patent-figure-classification
  venue: ECIR 2025
  home: true

- name: CARA
  repo: TIBHannover/CARA
  description: Open-source tool for building relevance judgments for image retrieval test collections. Annotators judge pools in groups of similar images, and a built-in simulator compares grouping settings before a study starts.
  tags: [relevance assessment, image retrieval, evaluation]
  code: https://github.com/TIBHannover/CARA
  docs: https://tibhannover.github.io/CARA/
  venue: Software, 2026
  home: true

- name: Colonial-Context VLM Bias Dataset
  description: Annotated historical photographs for measuring gender and skin-tone retrieval bias of vision-language models in archival collections.
  tags: [dataset, bias, cultural heritage, vision-language models]
  dataset: https://doi.org/10.5281/zenodo.19455764
  paper: /publications/awale2026websci/
  venue: WebSci 2026
  home: true

- name: Fusing Vision and Language Tutorial
  description: Full-day hands-on tutorial on vision-language models for multimodal content analysis, with slides and notebooks.
  tags: [tutorial, vision-language models]
  website: https://tib-visual-analytics.github.io/Konvens2025-FusingLanguageWithVision/
  venue: KONVENS 2025
  home: true

