job_title: Research Associate and PhD Candidate
summary: >-
  Sushil Awale is a Research Associate in the Visual Analytics Research Group at TIB – Leibniz
  Information Centre for Science and Technology in Hannover, Germany, and a PhD candidate at Leibniz
  Universität Hannover, supervised by Prof. Dr. Ralph Ewerth, and a member of the Multimodal
  Modelling and Machine Learning (M3L) team at Universität Marburg. Research focus: multimodal
  information retrieval for scientific, technical and cultural domains, building search systems with
  vision-language models for patents and cultural heritage collections.
