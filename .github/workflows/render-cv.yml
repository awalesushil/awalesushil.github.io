name: Render a CV
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rendercv:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install RenderCV
        run: |
          pip install -r requirements.txt
      - name: RenderCV
        run: |
          python bin/cv_pdf.py _data/cv.yml _bibliography/papers.bib assets/rendercv/cv.yaml
          rendercv render assets/rendercv/cv.yaml --settings assets/rendercv/settings.yaml
      - name: Upload rendercv_output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: RenderCV Output
          path: assets/pdf/cv.pdf
      - name: Push the changes
        run: |
          git config --global user.name "${{ github.actor }}"
          git config --global user.email "${{ github.actor }}@users.noreply.github.com"
          git add assets/pdf/cv.pdf
          git commit -m "chore: render the latest CV"
          git push
